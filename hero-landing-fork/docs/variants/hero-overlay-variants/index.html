<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero · texto sobre o vídeo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        padding: 2.5rem 1.5rem 3rem;
        background:
          radial-gradient(ellipse 70% 50% at 12% 0%, rgba(24,170,43,.12), transparent 55%),
          radial-gradient(ellipse 60% 40% at 90% 8%, rgba(0,19,78,.18), transparent 50%),
          #0f1422;
        color: #fff;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      main { max-width: 58rem; margin: 0 auto; }
      h1 {
        margin: 0 0 0.45rem;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        letter-spacing: -0.04em;
      }
      .lead { margin: 0 0 1.6rem; color: rgba(255,255,255,.72); line-height: 1.55; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        gap: 1rem;
      }
      .card {
        display: grid;
        gap: 0.3rem;
        padding: 1.2rem 1.1rem;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 1rem;
        background: rgba(255,255,255,.04);
        color: inherit;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }
      .card:hover { transform: translateY(-2px); background: rgba(255,255,255,.07); }
      .card strong { color: #18aa2b; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 1.5rem; }
      .card span { font-weight: 600; }
      .card em { color: rgba(255,255,255,.58); font-style: normal; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Texto por cima do vídeo</h1>
      <p class="lead">4 composições profissionais · full-bleed · sem botões de CTA.</p>
      <div class="grid">
        <a class="card" href="overlay-a.html"><strong>A</strong><span>A · Scrim esquerdo</span><em>Texto sobre o vídeo · sem CTAs</em></a>
        <a class="card" href="overlay-b.html"><strong>B</strong><span>B · Painel editorial</span><em>Texto sobre o vídeo · sem CTAs</em></a>
        <a class="card" href="overlay-c.html"><strong>C</strong><span>C · Base inferior</span><em>Texto sobre o vídeo · sem CTAs</em></a>
        <a class="card" href="overlay-d.html"><strong>D</strong><span>D · Vinheta</span><em>Texto sobre o vídeo · sem CTAs</em></a>
      </div>
    </main>
  </body>
</html>
